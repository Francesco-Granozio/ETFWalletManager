[project]
name = "pac-etf-tracker"
version = "0.1.0"
description = "Desktop PAC ETF portfolio tracker with allocation, rebalancing, and fixed snapshots."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.11.0",
    "customtkinter>=5.2.2",
    "matplotlib>=3.10.0",
    "numpy>=2.2.0",
    "pandas>=2.2.0",
    "python-dotenv>=1.0.1",
    "requests>=2.32.0",
    "sqlalchemy>=2.0.36",
    "justetf-scraping @ git+https://github.com/druzsan/justetf-scraping.git",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[project.scripts]
pac-etf-tracker = "main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
